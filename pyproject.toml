[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "managerai"
version = "0.1.0"
description = "Apoio histórico e auditável à preparação pré-jogo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Pins diretos já usados no ambiente validado; transitivas não estão congeladas.
ui = ["streamlit==1.65.0"]
v3 = ["streamlit==1.65.0", "matplotlib==3.11.2"]
# unittest é da biblioteca padrão; os opcionais abaixo habilitam toda a suíte UI/V3.
dev = ["streamlit==1.65.0", "matplotlib==3.11.2"]
# Experimento quantitativo opt-in; não altera dependências do núcleo/UI/V3.
experiments = ["numpy==2.5.2"]
api = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1"]
training = ["transformers==4.57.6", "peft==0.21.2", "torch==2.14.0"]
eda = [
    "pandas==3.0.5",
    "numpy==2.5.2",
    "pyarrow==25.0.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "nbformat==5.11.1",
    "pillow==12.3.0",
]
# Ajuste de explicação no extra training; não é dependência do produto padrão.

[project.scripts]
managerai = "managerai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["managerai*"]

[tool.setuptools.package-data]
managerai = ["statsbomb_snapshot.json"]
